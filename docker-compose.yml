version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: versa_postgres
    environment:
      POSTGRES_USER: versa_user
      POSTGRES_PASSWORD: versa_password
      POSTGRES_DB: versa_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: versa_redis
    ports:
      - '6379:6379'

volumes:
  pgdata:
